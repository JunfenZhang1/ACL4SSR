proxy-groups:
  - name: 🚀节点选择
    type: select
    proxies: [🔯故障转移, ☑️手动切换, ♻️自动选择, ♻️自动选择all, 🇺🇸美国s, 🇪🇺欧盟s, 🇺🇳其它s, 🇺🇸美国, 🇸🇬狮城, 🇰🇷韩国, 🇯🇵日本, 🇹🇼台湾, 🇭🇰香港, 🇺🇳其它, DIRECT]
  - name: 🍃ip净化
    type: select
    include-all: true
    proxies: [🇺🇸美国s, 🇪🇺欧盟s, 🇺🇳其它s, 🚀节点选择, 🔯故障转移, ☑️手动切换, ♻️自动选择, ♻️自动选择all, 🇺🇸美国, 🇸🇬狮城, 🇰🇷韩国, 🇯🇵日本, 🇹🇼台湾, 🇭🇰香港, 🇺🇳其它]
    filter: "(?i)^(?!.*(?:香港|澳门|澳門|大陆|内地|中转|中繼|专线|專線|回国|HK|Hong Kong|Macao|Macau|CN|CHN|Back to CN)).*$"
  - name: 🔯故障转移
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 180
    proxies: [🇺🇸美国, 🇸🇬狮城, 🇰🇷韩国, 🇯🇵日本, 🇹🇼台湾, 🇭🇰香港, 🇺🇳其它]
  - name: ☑️手动切换
    proxies: [🔯故障转移, ♻️自动选择, ♻️自动选择all, 🇺🇸美国s, 🇪🇺欧盟s, 🇺🇳其它s, 🇺🇸美国, 🇸🇬狮城, 🇰🇷韩国, 🇯🇵日本, 🇹🇼台湾, 🇭🇰香港, 🇺🇳其它]
    include-all: true
    type: select
  - name: 🇺🇸美国s
    type: select
    include-all: true
    exclude-type: direct
    filter: US|USA|(?i)\b(USA?|United States)\b|美国|美國|圣何塞|聖何塞|San Jose|\bSJC\b|洛杉矶|洛杉磯|Los Angeles|\bLAX\b|硅谷|矽谷|Silicon Valley|圣克拉拉|聖克拉拉|Santa Clara|费利蒙|費利蒙|Fremont|西雅图|Seattle|\bSEA\b|拉斯维加斯|Las Vegas|凤凰城|鳳凰城|Phoenix|\bPHX\b|达拉斯|達拉斯|Dallas|\bDFW\b|芝加哥|Chicago|\bORD\b|纽约|紐約|New York|\b(NYC|JFK|EWR)\b|水牛城|Buffalo|\bBUF\b|亚特兰大|亞特蘭大|Atlanta|\bATL\b|迈阿密|Miami|\bMIA\b|华盛顿|華盛頓|Washington|\bIAD\b|俄勒冈|Oregon|\bPDX\b
  - name: 🇪🇺欧盟s
    type: select
    include-all: true
    exclude-type: direct
    filter: EU|UK|GB|DE|FR|NL|IE|SE|IT|ES|PL|FI|BE|AT|DK|CZ|LU|(?i)\b(EU|DE|Germany|Frankfurt|FRA|UK|GB|United Kingdom|London|LHR|FR|France|Paris|CDG|NL|Netherlands|Amsterdam|AMS|IE|Ireland|Dublin|DUB|SE|Sweden|IT|Italy|ES|Spain|PL|Poland|FI|Finland|BE|Belgium|AT|Austria|DK|Denmark|CZ|Czech|LU|Luxembourg)\b|欧盟|德国|德國|法兰克福|英国|英國|伦敦|法国|法國|巴黎|荷兰|荷蘭|阿姆斯特丹|爱尔兰|愛爾蘭|都柏林|瑞典|意大利|西班牙|波兰|芬兰|比利时|奥地利|丹麦|捷克|卢森堡
  - name: 🇺🇳其它s
    type: select
    include-all: true
    exclude-type: direct
    filter: ^(?i)(?!.*(CN|China|中国|大陆|HK|Hong Kong|香港|TW|Taiwan|台湾|KR|Korea|韩国|JP|Japan|日本|SG|Singapore|新加坡|US|USA|United States|美国|EU|欧盟|UK|United Kingdom|英国|GB|United Kingdom|英国|DE|Germany|德国|FR|France|法国|NL|Netherlands|荷兰|IE|Ireland|爱尔兰|SE|Sweden|瑞典|IT|Italy|意大利|ES|Spain|西班牙|PL|Poland|波兰|FI|Finland|芬兰|BE|Belgium|比利时|AT|Austria|奥地利|DK|Denmark|丹麦|CZ|Czech Republic|捷克|LU|Luxembourg|卢森堡)).*$
  - name: ♻️自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies: [🇺🇸美国, 🇸🇬狮城, 🇰🇷韩国, 🇯🇵日本, 🇹🇼台湾, 🇭🇰香港, 🇺🇳其它]
  - name: ♻️自动选择all
    type: url-test
    url: http://www.gstatic.com/generate_204
