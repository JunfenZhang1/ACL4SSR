# proxy-groups
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [🔯 故障转移, ☑️ 手动切换, ♻️ 自动选择, 🔮 负债均衡, 🍃 ip净化, DIRECT]
  - name: ☑️ 手动切换
    type: select
    include-all: true
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
  - name: 🔯 故障转移
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 180
    include-all: true
  - name: 🔮 负债均衡
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    strategy: consistent-hashing
    include-all: true
  - name: 🍃 ip净化
    type: select
    include-all: true
  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, ☑️ 手动切换, ♻️ 自动选择, 🔯 故障转移, 🔮 负债均衡, 🍃 ip净化, DIRECT]
